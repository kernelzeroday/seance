[package]
name = "seance"
version = "0.1.2"
edition = "2024"
description = "One picker for every coding agent's sessions: browse, preview, resume, or start new"
license = "Apache-2.0"
repository = "https://github.com/kernelzeroday/seance"

[[bin]]
name = "seance"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.105"
clap = { version = "4.6.9", features = ["derive"] }
crossterm = { version = "0.29", features = ["use-dev-tty"] }
directories = "6.0.0"
ratatui = "0.30"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.2"
unicode-width = "0.2"

[profile.release]
lto = "thin"
codegen-units = 4
strip = "symbols"
